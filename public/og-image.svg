<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="ambientGlow" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bottomGlow" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="goldLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Deep Dark Canvas -->
  <rect width="1200" height="630" fill="#09090b" />
  <rect width="1200" height="630" fill="url(#ambientGlow)" />
  <rect width="1200" height="630" fill="url(#bottomGlow)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 110)">
    <!-- Brand Badge with Gold Logo -->
    <g>
      <rect width="64" height="64" rx="16" fill="url(#goldLogoGrad)" filter="url(#cardShadow)" />
      <g transform="translate(14, 14) scale(1.5)" fill="none" stroke="#09090b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
        <path d="M10 9H8" />
        <path d="M16 13H8" />
        <path d="M16 17H8" />
      </g>
      <text x="82" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
        ProResume Studio
      </text>
    </g>

    <!-- Main Catchy Heading -->
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Free Online Resume &amp; CV Builder
    </text>
    <text x="0" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#fbbf24">
      ATS-Friendly · High-Fidelity A4 PDF Export · 4 Pro Templates
    </text>

    <!-- Description -->
    <text x="0" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa">
      Create job-winning resumes in minutes with real-time live preview,
    </text>
    <text x="0" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa">
      custom luxury themes, and instant vector PDF downloads. No signup needed.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 330)">
      <!-- Pill 1 -->
      <g>
        <rect width="165" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
        <text x="20" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#fcd34d">✓ 100% Free</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="170" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
        <text x="20" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#fcd34d">✓ ATS Optimized</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(365, 0)">
        <rect width="175" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
        <text x="20" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#fcd34d">✓ Vector PDF Export</text>
      </g>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="440" font-family="ui-monospace, monospace" font-size="18" font-weight="600" fill="#f59e0b">
      https://proresumestudio.vercel.app
    </text>
  </g>

  <!-- Right Side Mockup Artwork -->
  <g transform="translate(770, 85)" filter="url(#cardShadow)">
    <!-- Back Resume Mockup -->
    <g transform="rotate(6, 170, 240)">
      <rect width="320" height="450" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    </g>
    <!-- Front Resume Mockup -->
    <g transform="rotate(-3, 160, 230)">
      <rect width="320" height="450" rx="14" fill="#18181b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2" />
      <!-- Mockup Document Lines -->
      <rect x="25" y="30" width="80" height="12" rx="4" fill="#f59e0b" />
      <rect x="25" y="52" width="140" height="8" rx="3" fill="#71717a" />
      <line x1="25" y1="75" x2="295" y2="75" stroke="#27272a" stroke-width="1.5" />

      <rect x="25" y="95" width="60" height="7" rx="3" fill="#fbbf24" fill-opacity="0.8" />
      <rect x="25" y="112" width="270" height="6" rx="3" fill="#52525b" />
      <rect x="25" y="126" width="240" height="6" rx="3" fill="#3f3f46" />

      <rect x="25" y="155" width="90" height="7" rx="3" fill="#fbbf24" fill-opacity="0.8" />
      <rect x="25" y="172" width="200" height="6" rx="3" fill="#71717a" />
      <rect x="25" y="186" width="270" height="5" rx="2.5" fill="#3f3f46" />
      <rect x="25" y="198" width="250" height="5" rx="2.5" fill="#3f3f46" />

      <!-- Mini badges -->
      <g transform="translate(25, 235)">
        <rect width="55" height="18" rx="9" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" />
        <rect x="62" width="65" height="18" rx="9" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" />
        <rect x="134" width="70" height="18" rx="9" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" />
      </g>
    </g>
  </g>
</svg>
